name: Keep schedules alive

# GitHub pauses scheduled workflows in public repos after 60 days without repository
# activity. The collector commits nothing, so during a quiet stretch it would silently stop.
# Twice a month this re-enables the collector through the GitHub API (no dummy commits),
# the approach keepalive tools use. Backstop: the Cloudflare Worker's watchdog alerts on
# Telegram if the collector hasn't run for 6 hours.
on:
  schedule:
    - cron: "17 3 1,15 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in collect.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "enabled $wf"
          done

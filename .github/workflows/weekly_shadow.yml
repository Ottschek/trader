name: Weekend shadows (reversal + research desk)

# Forward simulation of weekly_reversal (fake money, no orders): every weekend, a fresh daily
# window for the whole universe, then the frozen strategy on it. Sunday is a backup in case
# GitHub skips Saturday's schedule; a second run just recomputes the same numbers.
on:
  schedule:
    - cron: "17 9 * * 6"     # Saturday 09:17 UTC
    - cron: "17 9 * * 0"     # Sunday 09:17 UTC (backup)
  workflow_dispatch:

concurrency:
  group: research-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/reversal_shadow.py --cloud
      - name: AI research desk (month-end books, AI memos, portfolios)
        run: python scripts/research_desk.py --cloud

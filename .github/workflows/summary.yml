name: Daily summary

on:
  schedule:
    # GitHub cron is UTC only. 08:00 and 22:30 Vienna fall on different UTC hours in summer
    # and winter, so fire at both; scripts/summary.py only sends at the right local time.
    - cron: "0 6,7 * * *"
    - cron: "30 20,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # a manual "Run workflow" click always sends
      - run: python scripts/summary.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

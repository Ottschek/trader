# Main settings. Secrets (API keys) do NOT go here — they live in .env.

timeframe: 1h
history_start: "2016-01-01"

universe:
  # Note: a hand-picked list of today's names is survivorship-biased.
  # Fine for building infrastructure; single-stock strategies must account for it in M3.
  stocks:
    # broad market / macro ETFs
    - SPY
    - QQQ
    - IWM
    - DIA
    - TLT
    - GLD
    # large caps
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - JPM
    - XOM
    # crypto-linked (for cross-asset ideas)
    - COIN
    - MSTR
    - MARA
    - RIOT
    - IBIT
  crypto:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - LTC/USD
    - DOGE/USD
    - AVAX/USD
    - LINK/USD
    - UNI/USD
    - AAVE/USD
    - BCH/USD

benchmarks:
  stocks: SPY
  crypto: BTC/USD

# Enforced by the risk manager (M5). Fractions of account equity.
risk:
  max_position_pct: 0.10
  max_daily_loss_pct: 0.03
  kill_switch_drawdown_pct: 0.15

# Trading costs per venue, in basis points (1 bp = 0.01%). Applied on every trade.
costs:
  alpaca_stocks:
    commission_bps: 0
    spread_bps: 2
    slippage_bps: 3
  alpaca_crypto:
    commission_bps: 25   # Alpaca crypto taker fee, lowest volume tier
    spread_bps: 5
    slippage_bps: 5
  carry:                 # funding harvest: buy spot (Alpaca 25 bps) + short perp (Hyperliquid ~4.5 bps), both legs
    commission_bps: 30
    spread_bps: 4
    slippage_bps: 8
  alpaca_smallcaps:      # daily-bar stock universe (insider clusters, earnings drift): wide spreads
    commission_bps: 0
    spread_bps: 40
    slippage_bps: 10
  alpaca_largecaps:      # liquid stocks only (>= $50M a day traded; insider_cluster_large)
    commission_bps: 0
    spread_bps: 6
    slippage_bps: 4

# Cloud: where the hourly GitHub Actions run keeps its data and reports.
cloud:
  r2_bucket: trader-data
  d1_database_id: a4287e14-2892-4a4f-9953-a6bab17c2716
  timezone: Europe/Vienna
  summary_times: ["08:00", "22:30"]   # daily Telegram status, local time

# M3 validation: the rules a strategy must pass. Fixed in advance - no moving goalposts.
validation:
  research_start: "2016-01-01"
  holdout_start: "2024-10-18"   # last 2 years are LOCKED: research code can't load them
  train_years: 2                # walk-forward: tune on 2 years ...
  test_months: 6                # ... then test on the next 6 months, roll forward, repeat
  min_oos_sharpe: 1.0
  max_oos_drawdown: 0.20
  max_p_value: 0.05             # must beat 95% of random-entry versions of itself
  min_deflated_sharpe: 0.95     # probability the Sharpe is real after counting every trial
  random_trials: 500

# Alternative data collectors (src/trader/data/alt.py). Free sources; daily ones refresh once a day.
alt_data:
  stablecoins: {USDT: 1, USDC: 2}          # DefiLlama stablecoin ids (full daily history)
  # Wikipedia pageviews as an attention gauge (history since 2015). Renamed articles: views
  # of the old and new title are added up.
  wikipedia:
    BTC/USD: [Bitcoin]
    ETH/USD: [Ethereum]
    SOL/USD: [Solana_(blockchain_platform)]
    DOGE/USD: [Dogecoin]
    LTC/USD: [Litecoin]
    AVAX/USD: [Avalanche_(blockchain_platform)]
    LINK/USD: [Chainlink_(blockchain)]
    UNI/USD: [Uniswap]
    AAVE/USD: [Aave]
    BCH/USD: [Bitcoin_Cash]
    COIN: [Coinbase]
    MSTR: [MicroStrategy]
    MARA: [MARA_Holdings, Marathon_Digital_Holdings, Marathon_Patent_Group]
    NVDA: [Nvidia]
    TSLA: ["Tesla,_Inc.", Tesla_Motors]
    AAPL: [Apple_Inc.]
    AMZN: [Amazon_(company)]
    MSFT: [Microsoft]
    GOOGL: [Alphabet_Inc.]
    META: [Meta_Platforms, "Facebook,_Inc."]
    JPM: [JPMorgan_Chase]
    XOM: [ExxonMobil]
    SPY: [SPDR_S&P_500_Trust_ETF]
    QQQ: [Invesco_QQQ]
  polymarket_top_n: 100                     # hourly snapshot of the most-traded markets

# LLM news analyst: forward-only SHADOW experiment (paper/news_analyst.py). Rules frozen on
# 2026-10-19 before the first run; change them only by starting a new experiment.
# Needs ANTHROPIC_API_KEY (.env locally, GitHub secret in the cloud); without it only the free
# headline collection runs.
news:
  start: "2026-10-19"
  every_hours: 6
  model: claude-opus-5-5
  effort: low
  monthly_budget_usd: 5.0     # hard cap, paced evenly through the month
  signal_threshold: 2         # |sum of impacts| for one asset in one run
  yahoo_overrides: {}         # symbol -> Yahoo ticker, if the default (BTC/USD -> BTC-USD) is wrong
  assets:
    SPY: S&P 500 index ETF (US market)
    QQQ: Nasdaq-100 index ETF (US tech)
    IWM: Russell 2000 index ETF (US small caps)
    TLT: 20+ year US Treasury bond ETF
    GLD: gold ETF
    AAPL: Apple
    MSFT: Microsoft
    NVDA: Nvidia
    AMZN: Amazon
    GOOGL: Alphabet (Google)
    META: Meta Platforms
    TSLA: Tesla
    JPM: JPMorgan Chase
    XOM: Exxon Mobil
    COIN: Coinbase (crypto exchange stock)
    MSTR: Strategy / MicroStrategy (bitcoin treasury stock)
    MARA: MARA Holdings (bitcoin miner)
    RIOT: Riot Platforms (bitcoin miner)
    BTC/USD: Bitcoin
    ETH/USD: Ethereum
    SOL/USD: Solana
    DOGE/USD: Dogecoin
    LTC/USD: Litecoin
    AVAX/USD: Avalanche
    LINK/USD: Chainlink
    AAVE/USD: Aave
    BCH/USD: Bitcoin Cash

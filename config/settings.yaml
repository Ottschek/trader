# Main settings. Secrets (API keys) do NOT go here — they live in .env.

timeframe: 1h
history_start: "2016-01-01"

universe:
  # Note: a hand-picked list of today's names is survivorship-biased.
  # Fine for building infrastructure; single-stock strategies must account for it in M3.
  stocks:
    # broad market / macro ETFs
    - SPY
    - QQQ
    - IWM
    - DIA
    - TLT
    - GLD
    # large caps
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - JPM
    - XOM
    # crypto-linked (for cross-asset ideas)
    - COIN
    - MSTR
    - MARA
    - RIOT
    - IBIT
  crypto:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - LTC/USD
    - DOGE/USD
    - AVAX/USD
    - LINK/USD
    - UNI/USD
    - AAVE/USD
    - BCH/USD

benchmarks:
  stocks: SPY
  crypto: BTC/USD

# Enforced by the risk manager (M5). Fractions of account equity.
risk:
  max_position_pct: 0.10
  max_daily_loss_pct: 0.03
  kill_switch_drawdown_pct: 0.15

# Trading costs per venue, in basis points (1 bp = 0.01%). Applied on every trade.
costs:
  alpaca_stocks:
    commission_bps: 0
    spread_bps: 2
    slippage_bps: 3
  alpaca_crypto:
    commission_bps: 25   # Alpaca crypto taker fee, lowest volume tier
    spread_bps: 5
    slippage_bps: 5

# Cloud: where the hourly GitHub Actions run keeps its data and reports.
cloud:
  r2_bucket: trader-data
  d1_database_id: a4287e14-2892-4a4f-9953-a6bab17c2716
  timezone: Europe/Vienna
  summary_times: ["08:00", "22:30"]   # daily Telegram status, local time

# M3 validation: the rules a strategy must pass. Fixed in advance - no moving goalposts.
validation:
  research_start: "2016-01-01"
  holdout_start: "2024-10-18"   # last 2 years are LOCKED: research code can't load them
  train_years: 2                # walk-forward: tune on 2 years ...
  test_months: 6                # ... then test on the next 6 months, roll forward, repeat
  min_oos_sharpe: 1.0
  max_oos_drawdown: 0.20
  max_p_value: 0.05             # must beat 95% of random-entry versions of itself
  min_deflated_sharpe: 0.95     # probability the Sharpe is real after counting every trial
  random_trials: 500

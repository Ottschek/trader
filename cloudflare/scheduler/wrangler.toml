# The time-critical jobs, on Cloudflare's reliable clock (GitHub's cron often starts runs hours late):
#   - record Hyperliquid open interest every hour (it can't be downloaded later)
#   - send the daily Telegram summaries at 08:00 and 22:30 Vienna time
#   - watchdog: Telegram alert if the GitHub collector hasn't run for too long
# Bulk price collection stays in GitHub Actions; late runs simply catch up.
name = "trader-scheduler"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false   # no public URL: this Worker only runs on its schedule

[triggers]
# One trigger only: the free plan allows 5 cron triggers per account, shared by all Workers.
#   :00 -> open interest snapshot + watchdog (+ summary if it's 08:00 in Vienna)
#   :30 -> summary if it's 22:30 in Vienna
crons = ["0,30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "trader"
database_id = "a4287e14-2892-4a4f-9953-a6bab17c2716"

[vars]
COINS = "BTC,ETH,SOL,LTC,DOGE,AVAX,LINK,UNI,AAVE,BCH"
TIMEZONE = "Europe/Vienna"
SUMMARY_TIMES = "08:00,22:30"
MAX_COLLECTOR_LAG_HOURS = "6"
DASHBOARD_URL = "https://trader-web-6t6.pages.dev"

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
